[env:esp32s3]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.12.5

; Default Serial uses the board's USB-to-UART bridge.
; For native USB CDC instead, use the correct USB port and uncomment:
; build_flags =
;     -D ARDUINO_USB_CDC_ON_BOOT=1
;     -D ARDUINO_USB_MODE=1
