[env:esp32s3]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
; Keep standalone N16R8 diagnostics out of every operational firmware build.
build_src_filter = +<*> -<NativeUsbN16R8Diagnostics.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.12.5
    knolleary/PubSubClient @ 2.8
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0

; Default Serial uses the board's USB-to-UART bridge.
; The native USB variant below works without an external USB-UART converter.
; ESP32-S3 native USB D- = GPIO19, D+ = GPIO20.
;
; Build the UART variant: pio run -e esp32s3
; Build native USB CDC:   pio run -e esp32s3_native_usb
;
; Hardware CDC/JTAG keeps Serial / ASCII commands / binary RGB on the
; ESP32-S3 USB connector, without changing fan GPIO, NVS or safety guards.
[env:esp32s3_native_usb]
extends = env:esp32s3
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D FANARGB_NATIVE_USB_BUILD=1
upload_protocol = esptool

; SAFE N16R8 recovery/diagnostic ONLY. Never initialises fan PWM, TACH, ARGB
; or GPIO35..37, which are hard-wired to the module's 8MB Octal PSRAM.
; Do not mistake this for a functional 8-fan firmware.
[env:esp32s3_n16r8_usb_diag]
extends = env:esp32s3_native_usb
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
; PlatformIO Arduino-ESP32 2.0.17 only bundles the ESP32-S3 QIO 80 MHz
; bootloader for this memory type (DIO/QIO 40 MHz ELF is missing).
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM=1
    -D FANARGB_N16R8_USB_DIAGNOSTIC=1
build_src_filter = -<*> +<NativeUsbN16R8Diagnostics.cpp>

; OPERATING firmware for ESP32-S3-WROOM-1-N16R8, via native USB.
; All 8 logical channels are active in this ordinary N16R8 build. Channel 2
; is mapped to GPIO8 / GPIO11 / GPIO17 instead of PSRAM GPIO35/36/37.
; The physical fan gate/TACH/ARGB2 lines must be rerouted to those pins.
; DC fan power interlocks and all thermal/fault protection remain unchanged.
[env:esp32s3_n16r8_native_usb]
extends = env:esp32s3_n16r8_usb_diag
build_src_filter = +<*> -<NativeUsbN16R8Diagnostics.cpp>
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM=1
    -D FANARGB_NATIVE_USB_BUILD=1
    -D FANARGB_N16R8_SAFE=1
    -D FANARGB_N16R8_FAN2_REROUTED=1

; Explicit opt-in for the user's bench-validated DC power stage ONLY.
; The standard N16R8 build now enables FAN2 on GPIO8/11/17. This DC opt-in
; changes only the supply-PWM duty interlock, not pins or safety protections.
[env:esp32s3_n16r8_native_usb_dc_validated]
extends = env:esp32s3_n16r8_native_usb
build_flags =
    ${env:esp32s3_n16r8_native_usb.build_flags}
    -D FAN_DC_PWM_VALIDATED=1

; Compatibility aliases retained for previously documented opt-in builds.
; The standard N16R8 native-USB environment already uses the same 8-pin routing.
; Never connect external peripherals to internal PSRAM GPIO35/36/37.
[env:esp32s3_n16r8_native_usb_fan2_rerouted]
extends = env:esp32s3_n16r8_native_usb
build_flags =
    ${env:esp32s3_n16r8_native_usb.build_flags}
    -D FANARGB_N16R8_FAN2_REROUTED=1

; Optional DC supply-PWM unlock on top of the physical reroute.
; Thermal/fault/failsafe protections remain unchanged.
[env:esp32s3_n16r8_native_usb_fan2_rerouted_dc_validated]
extends = env:esp32s3_n16r8_native_usb_fan2_rerouted
build_flags =
    ${env:esp32s3_n16r8_native_usb_fan2_rerouted.build_flags}
    -D FAN_DC_PWM_VALIDATED=1
