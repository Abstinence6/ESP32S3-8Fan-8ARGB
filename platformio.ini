[env:esp32s3]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.12.5
    knolleary/PubSubClient @ 2.8
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0

; Default Serial uses the board's USB-to-UART bridge.
; The native USB variant below works without an external USB-UART converter.
; ESP32-S3 native USB D- = GPIO19, D+ = GPIO20.
;
; Build the UART variant: pio run -e esp32s3
; Build native USB CDC:   pio run -e esp32s3_native_usb
;
; Hardware CDC/JTAG keeps Serial / ASCII commands / binary RGB on the
; ESP32-S3 USB connector, without changing fan GPIO, NVS or safety guards.
[env:esp32s3_native_usb]
extends = env:esp32s3
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D FANARGB_NATIVE_USB_BUILD=1
upload_protocol = esptool

; SAFE N16R8 recovery/diagnostic ONLY. Never initialises fan PWM, TACH, ARGB
; or GPIO35..37, which are hard-wired to the module's 8MB Octal PSRAM.
; Do not mistake this for a functional 8-fan firmware.
[env:esp32s3_n16r8_usb_diag]
extends = env:esp32s3_native_usb
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM=1
    -D FANARGB_N16R8_USB_DIAGNOSTIC=1
build_src_filter = -<*> +<NativeUsbN16R8Diagnostics.cpp>
