name: Apply prepared source bundle
on:
  push:
    branches:
      - feat/calibration-pc-control
    paths:
      - '.bootstrap/payload.b64'
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand source bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import zlib
          from pathlib import Path
          p = Path('.bootstrap/payload.b64')
          files = json.loads(zlib.decompress(base64.urlsafe_b64decode(p.read_text())))
          for filename, contents in files.items():
              path = Path(filename)
              if path.is_absolute() or '..' in path.parts:
                  raise ValueError('Unsafe path: ' + filename)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(contents, encoding='utf-8')
          p.unlink()
          print('Expanded', len(files), 'source files.')
          PY
      - name: Host firmware and Python tests
        run: |
          bash test/native/run.sh
          python3 -m unittest discover -s pc_app/tests -v
          python3 -m compileall -q pc_app
      - name: PlatformIO build
        run: |
          python -m pip install platformio
          pio run -e esp32s3
      - name: Commit passing firmware and desktop app
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: persist fan calibration and thermal curves; add Windows GUI'
          git push origin HEAD:feat/calibration-pc-control
