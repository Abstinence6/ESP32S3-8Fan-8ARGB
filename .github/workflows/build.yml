name: PlatformIO build
on:
  push:
  pull_request:
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host-side firmware smoke tests
        run: bash test/native/run.sh
      - name: Python protocol and sensor unit tests
        run: python -m unittest discover -s pc_app/tests -v
      - name: Python syntax check
        run: python -m compileall -q pc_app
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ESP32-S3 firmware
        run: pio run -e esp32s3
      - name: Verify actual compiled ESP32-S3 image integrity
        run: |
          python -c "from pc_app.firmware_update import inspect_firmware; print('Validated chip / segments / checksum:', inspect_firmware('.pio/build/esp32s3/firmware.bin'))"
      - name: Collect flashable binary images
        shell: bash
        run: |
          set -eu
          mkdir -p dist/esp32s3
          cp .pio/build/esp32s3/firmware.bin dist/esp32s3/firmware.bin
          cp .pio/build/esp32s3/bootloader.bin dist/esp32s3/bootloader.bin
          cp .pio/build/esp32s3/partitions.bin dist/esp32s3/partitions.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/esp32s3/boot_app0.bin
          cat > dist/esp32s3/FLASH.txt <<'EOF'
          ESP32-S3 / PlatformIO environment: esp32s3
          Verify the exact board, flash size, partition layout and GPIO wiring.
          Install esptool and replace COMx with the actual serial port.

          Fresh flash (bootloader, partitions, boot_app0 and application):
          python -m esptool --chip esp32s3 --port COMx write_flash \
            0x0 bootloader.bin 0x8000 partitions.bin \
            0xe000 boot_app0.bin 0x10000 firmware.bin

          Firmware-only update (only with matching partition layout):
          python -m esptool --chip esp32s3 --port COMx write_flash 0x10000 firmware.bin

          IMPORTANT: GPIO35-37 cannot be used on Octal-PSRAM variants.
          GPIO46 is a bootstrapping pin: verify attached circuits at reset.
          PC_POWER_ENABLED=0 and FAN_DC_PWM_VALIDATED=0 by default.
          Do not enable unvalidated DC fan supply PWM.
          EOF
      - name: Verify firmware files and write release manifest
        run: |
          python scripts/build_manifest.py --component firmware --directory dist/esp32s3 --commit "$GITHUB_SHA" \
            --file bootloader.bin --file partitions.bin --file boot_app0.bin --file firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-8Fan-8ARGB-firmware
          path: dist/esp32s3/
          if-no-files-found: error
      - name: Build ESP32-S3 native USB CDC firmware (no USB-UART bridge)
        run: |
          pio run -e esp32s3_native_usb
          python -c "from pc_app.firmware_update import inspect_firmware; print('Native USB ESP32-S3 image:', inspect_firmware('.pio/build/esp32s3_native_usb/firmware.bin'))"
      - name: Package USB CDC image and recovery instructions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/esp32s3_native_usb
          cp .pio/build/esp32s3_native_usb/firmware.bin dist/esp32s3_native_usb/firmware.bin
          cp .pio/build/esp32s3_native_usb/bootloader.bin dist/esp32s3_native_usb/bootloader.bin
          cp .pio/build/esp32s3_native_usb/partitions.bin dist/esp32s3_native_usb/partitions.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/esp32s3_native_usb/boot_app0.bin
          cp docs/NATIVE_USB_RECOVERY.md dist/esp32s3_native_usb/FLASH.txt
          python scripts/build_manifest.py --component firmware \
            --environment esp32s3_native_usb --directory dist/esp32s3_native_usb \
            --commit "$GITHUB_SHA" --file bootloader.bin --file partitions.bin \
            --file boot_app0.bin --file firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-8Fan-8ARGB-native-USB-CDC
          path: dist/esp32s3_native_usb/
          if-no-files-found: error
      - name: Compile safe ESP32-S3-N16R8 native USB recovery diagnostics
        run: |
          pio run -e esp32s3_n16r8_usb_diag
          python -c "from pc_app.firmware_update import inspect_firmware; print('N16R8 diagnostic ESP32-S3 image:', inspect_firmware('.pio/build/esp32s3_n16r8_usb_diag/firmware.bin'))"
      - name: Package N16R8 diagnostics and flash integrity checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/esp32s3_n16r8_usb_diag
          cp .pio/build/esp32s3_n16r8_usb_diag/firmware.bin dist/esp32s3_n16r8_usb_diag/firmware.bin
          cp .pio/build/esp32s3_n16r8_usb_diag/bootloader.bin dist/esp32s3_n16r8_usb_diag/bootloader.bin
          cp .pio/build/esp32s3_n16r8_usb_diag/partitions.bin dist/esp32s3_n16r8_usb_diag/partitions.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/esp32s3_n16r8_usb_diag/boot_app0.bin
          cp docs/N16R8_USB_DIAGNOSTIC.md dist/esp32s3_n16r8_usb_diag/INSTRUCTIONS.txt
          python scripts/build_manifest.py --component firmware --environment esp32s3_n16r8_usb_diag \
            --directory dist/esp32s3_n16r8_usb_diag --commit "$GITHUB_SHA" \
            --file bootloader.bin --file partitions.bin --file boot_app0.bin --file firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-N16R8-USB-DIAGNOSTIC
          path: dist/esp32s3_n16r8_usb_diag/
          if-no-files-found: error
      - name: Compile operational ESP32-S3 N16R8 with native USB and 8 remapped channels
        run: |
          pio run -e esp32s3_n16r8_native_usb
          python -c "from pc_app.firmware_update import inspect_firmware; print('N16R8 operational application:', inspect_firmware('.pio/build/esp32s3_n16r8_native_usb/firmware.bin'))"
      - name: Package one full-flash BIN for N16R8 (NVS reset warning)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/esp32s3_n16r8_native_usb
          cp .pio/build/esp32s3_n16r8_native_usb/firmware.bin dist/esp32s3_n16r8_native_usb/firmware.bin
          cp .pio/build/esp32s3_n16r8_native_usb/bootloader.bin dist/esp32s3_n16r8_native_usb/bootloader.bin
          cp .pio/build/esp32s3_n16r8_native_usb/partitions.bin dist/esp32s3_n16r8_native_usb/partitions.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/esp32s3_n16r8_native_usb/boot_app0.bin
          python scripts/merge_flash_images.py --directory dist/esp32s3_n16r8_native_usb \
            --output dist/esp32s3_n16r8_native_usb/ESP32S3-N16R8-NativeUSB-FULL.bin
          cp docs/N16R8_NATIVE_USB_WORKING.md dist/esp32s3_n16r8_native_usb/INSTRUCTIONS.txt
          cp docs/N16R8_BOOT_VALIDATION.md dist/esp32s3_n16r8_native_usb/BOOT_VALIDATION.md
          cp scripts/preflight_n16r8_image.py dist/esp32s3_n16r8_native_usb/preflight_n16r8_image.py
          python scripts/build_manifest.py --component firmware \
            --environment esp32s3_n16r8_native_usb \
            --directory dist/esp32s3_n16r8_native_usb --commit "$GITHUB_SHA" \
            --file bootloader.bin --file partitions.bin --file boot_app0.bin \
            --file firmware.bin --file ESP32S3-N16R8-NativeUSB-FULL.bin
          python scripts/preflight_n16r8_image.py --image dist/esp32s3_n16r8_native_usb/ESP32S3-N16R8-NativeUSB-FULL.bin --manifest dist/esp32s3_n16r8_native_usb/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-N16R8-NativeUSB-FULL
          path: dist/esp32s3_n16r8_native_usb/
          if-no-files-found: error
      - name: Compile opt-in N16R8 DC-unlocked firmware (hardware validation still required)
        run: |
          pio run -e esp32s3_n16r8_native_usb_dc_validated
          python -c "from pc_app.firmware_update import inspect_firmware; print('Opt-in N16R8 DC-unlocked application:', inspect_firmware('.pio/build/esp32s3_n16r8_native_usb_dc_validated/firmware.bin'))"
      - name: Package opt-in N16R8 DC-unlocked full-flash BIN (NVS reset warning)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/esp32s3_n16r8_native_usb_dc_validated
          cp .pio/build/esp32s3_n16r8_native_usb_dc_validated/firmware.bin dist/esp32s3_n16r8_native_usb_dc_validated/firmware.bin
          cp .pio/build/esp32s3_n16r8_native_usb_dc_validated/bootloader.bin dist/esp32s3_n16r8_native_usb_dc_validated/bootloader.bin
          cp .pio/build/esp32s3_n16r8_native_usb_dc_validated/partitions.bin dist/esp32s3_n16r8_native_usb_dc_validated/partitions.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/esp32s3_n16r8_native_usb_dc_validated/boot_app0.bin
          python scripts/merge_flash_images.py --directory dist/esp32s3_n16r8_native_usb_dc_validated \
            --output dist/esp32s3_n16r8_native_usb_dc_validated/ESP32S3-N16R8-NativeUSB-DC-VALIDATED-FULL.bin
          cp docs/N16R8_DC_UNLOCK_RELEASE.md dist/esp32s3_n16r8_native_usb_dc_validated/INSTRUCTIONS.txt
          python scripts/build_manifest.py --component firmware \
            --environment esp32s3_n16r8_native_usb_dc_validated \
            --directory dist/esp32s3_n16r8_native_usb_dc_validated --commit "$GITHUB_SHA" \
            --file bootloader.bin --file partitions.bin --file boot_app0.bin \
            --file firmware.bin --file ESP32S3-N16R8-NativeUSB-DC-VALIDATED-FULL.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-N16R8-NativeUSB-DC-VALIDATED-FULL-OPT-IN
          path: dist/esp32s3_n16r8_native_usb_dc_validated/
          if-no-files-found: error
      - name: Compile opt-in DS18B20 firmware (GPIO18 test configuration)
        env:
          PLATFORMIO_BUILD_FLAGS: "-D HARDWARE_TEMP_ENABLED=1 -D HARDWARE_TEMP_GPIO=18"
        run: |
          pio run -e esp32s3 -t clean
          pio run -e esp32s3

      - name: Compile N16R8 physically rerouted FAN2/ARGB2 builds (opt-in only)
        run: |
          pio run -e esp32s3_n16r8_native_usb_fan2_rerouted
          pio run -e esp32s3_n16r8_native_usb_fan2_rerouted_dc_validated
          python -c "from pc_app.firmware_update import inspect_firmware; print('Rerouted N16R8 application:', inspect_firmware('.pio/build/esp32s3_n16r8_native_usb_fan2_rerouted_dc_validated/firmware.bin'))"
      - name: Package one full BIN for opt-in physical FAN2 reroute
        shell: bash
        run: |
          set -euo pipefail
          build=".pio/build/esp32s3_n16r8_native_usb_fan2_rerouted_dc_validated"
          dist="dist/esp32s3_n16r8_native_usb_fan2_rerouted_dc_validated"
          mkdir -p "$dist"
          cp "$build/firmware.bin" "$build/bootloader.bin" "$build/partitions.bin" "$dist/"
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" "$dist/boot_app0.bin"
          python scripts/merge_flash_images.py --directory "$dist" \
            --output "$dist/ESP32S3-N16R8-FAN2-REROUTED-DC-FULL.bin"
          cp docs/N16R8_FAN2_REROUTE.md "$dist/INSTRUCTIONS.txt"
          python scripts/build_manifest.py --component firmware \
            --environment esp32s3_n16r8_native_usb_fan2_rerouted_dc_validated \
            --directory "$dist" --commit "$GITHUB_SHA" \
            --file bootloader.bin --file partitions.bin --file boot_app0.bin \
            --file firmware.bin --file ESP32S3-N16R8-FAN2-REROUTED-DC-FULL.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-N16R8-FAN2-REROUTED-DC-FULL-OPT-IN
          path: dist/esp32s3_n16r8_native_usb_fan2_rerouted_dc_validated/
          if-no-files-found: error
