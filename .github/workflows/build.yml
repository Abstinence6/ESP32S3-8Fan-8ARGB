name: PlatformIO build
on:
  push:
  pull_request:
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host-side firmware smoke tests
        run: bash test/native/run.sh
      - name: Python protocol and sensor unit tests
        run: python -m unittest discover -s pc_app/tests -v
      - name: Python syntax check
        run: python -m compileall -q pc_app
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build ESP32-S3 firmware
        run: pio run -e esp32s3
      - name: Collect flashable binary images
        shell: bash
        run: |
          set -eu
          mkdir -p dist/esp32s3
          cp .pio/build/esp32s3/firmware.bin dist/esp32s3/firmware.bin
          cp .pio/build/esp32s3/bootloader.bin dist/esp32s3/bootloader.bin
          cp .pio/build/esp32s3/partitions.bin dist/esp32s3/partitions.bin
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/esp32s3/boot_app0.bin
          printf '%s\n'             'ESP32-S3, PlatformIO env esp32s3; GPIO mapping documented in README.md.'             'Fresh flash: install esptool then run the command below from this folder.'             'python -m esptool --chip esp32s3 --port COMx write_flash 0x0 bootloader.bin 0x8000 partitions.bin 0xe000 boot_app0.bin 0x10000 firmware.bin'             'Existing matching partition layout: python -m esptool --chip esp32s3 --port COMx write_flash 0x10000 firmware.bin'             'IMPORTANT: GPIO35-37 are not usable on Octal-PSRAM variants. GPIO46 is a bootstrapping pin.'             'PC_POWER_ENABLED=0 and FAN_DC_PWM_VALIDATED=0 by default.'             > dist/esp32s3/FLASH.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-8Fan-8ARGB-firmware
          path: dist/esp32s3/
          if-no-files-found: error
      - name: Compile opt-in DS18B20 firmware (GPIO18 test configuration)
        env:
          PLATFORMIO_BUILD_FLAGS: "-D HARDWARE_TEMP_ENABLED=1 -D HARDWARE_TEMP_GPIO=18"
        run: |
          pio run -e esp32s3 -t clean
          pio run -e esp32s3
