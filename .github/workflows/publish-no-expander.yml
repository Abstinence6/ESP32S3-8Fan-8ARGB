name: Apply v4 3-pin hardware revision
on:
  push:
    branches: [feat/v4-smart-cooling-universal-fans]
    paths: [".bootstrap/no-expander.b64"]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand revised sources
        run: |
          python3 - <<'PY'
          import base64, json, zlib
          from pathlib import Path
          source = Path('.bootstrap/no-expander.b64')
          bundle = json.loads(zlib.decompress(base64.urlsafe_b64decode(source.read_text().strip())))
          files, deletions = bundle['files'], bundle['delete']
          for filename, value in files.items():
              path = Path(filename)
              if path.is_absolute() or '..' in path.parts or '.github' in path.parts or '.bootstrap' in path.parts:
                  raise ValueError('Unsafe file: ' + filename)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(value, encoding='utf-8')
          for filename in deletions:
              path = Path(filename)
              if path.is_absolute() or '..' in path.parts or '.github' in path.parts or '.bootstrap' in path.parts:
                  raise ValueError('Unsafe deletion: ' + filename)
              path.unlink()
          source.unlink()
          print('Updated',len(files),'deleted',len(deletions))
          PY
      - name: C++ host tests and safety interlock
        run: bash test/native/run.sh
      - name: Windows app unit tests
        run: python -m unittest discover -s pc_app/tests -v
      - name: Python syntax
        run: python -m compileall -q pc_app
      - name: Install PlatformIO and build ESP32-S3
        run: |
          python -m pip install platformio
          pio run -e esp32s3
      - name: Commit passing hardware revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: default 3-pin, two GPIO per fan, jumper 4-pin, remove MCP23017'
          git push origin HEAD:feat/v4-smart-cooling-universal-fans
