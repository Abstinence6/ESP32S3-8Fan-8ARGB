name: Publish paired GitHub Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
    branches:
      - 'release/v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#release/}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
             [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" != "release/$release_tag" ]]; then
            echo 'Release must be tag vMAJOR.MINOR.PATCH or branch release/vMAJOR.MINOR.PATCH'
            exit 1
          fi
      - name: Run native and protocol tests
        run: |
          bash test/native/run.sh
          python -m unittest discover -s pc_app/tests -v
          python -m compileall -q pc_app
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build and verify ESP32-S3 firmware
        run: |
          pio run -e esp32s3
          python -c "from pc_app.firmware_update import inspect_firmware; print(inspect_firmware('.pio/build/esp32s3/firmware.bin'))"
      - name: Assemble firmware release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/esp32s3
          cp .pio/build/esp32s3/firmware.bin dist/esp32s3/
          cp .pio/build/esp32s3/bootloader.bin dist/esp32s3/
          cp .pio/build/esp32s3/partitions.bin dist/esp32s3/
          BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" dist/esp32s3/boot_app0.bin
          cat > dist/esp32s3/FLASH.txt <<'EOF'
          ESP32-S3 / PlatformIO env esp32s3.
          Check physical GPIO wiring, flash and partition layout before use.
          To update firmware only on an already compatible device:
          python -m esptool --chip esp32s3 --port COMx write_flash 0x10000 firmware.bin
          WARNING: Only flash with PC safely off / hardware fail-ON verified.
          EOF
          python scripts/build_manifest.py --component firmware --directory dist/esp32s3 \
            --commit "$GITHUB_SHA" \
            --file bootloader.bin --file partitions.bin --file boot_app0.bin --file firmware.bin
          (
            cd dist/esp32s3
            zip -q ../ESP32S3-8Fan-8ARGB-firmware.zip \
              firmware.bin bootloader.bin partitions.bin boot_app0.bin \
              manifest.json SHA256SUMS FLASH.txt
          )
      - uses: actions/upload-artifact@v4
        with:
          name: github-release-firmware
          path: dist/ESP32S3-8Fan-8ARGB-firmware.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inject release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^release/', ''
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+
      - name: Unit tests
        run: python -m unittest discover -s pc_app/tests -v
      - name: Install dependencies
        run: python -m pip install -r pc_app/requirements.txt pyinstaller
      - name: Smoke test Windows UI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest pc_app.tests.test_dashboard_smoke -v
      - name: Prepare verified NWinfo
        shell: pwsh
        run: ./pc_app/prepare_nwinfo.ps1 -OutputDirectory dist/nwinfo
      - name: Build standalone Windows EXE
        run: python -m PyInstaller --clean --noconfirm --windowed --onefile --paths pc_app --add-data "dist/nwinfo;nwinfo" --collect-all esptool --name FanARGBControl pc_app/main.py
      - name: Verify bundled modules and NWinfo
        run: python pc_app/verify_windows_bundle.py dist/FanARGBControl.exe
      - name: Package Windows release
        shell: pwsh
        run: |
          python scripts/build_manifest.py --component windows --directory dist --commit $env:GITHUB_SHA --file FanARGBControl.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows manifest failed' }
          Compress-Archive -Path @("dist/FanARGBControl.exe","dist/manifest.json","dist/SHA256SUMS") -DestinationPath dist/FanARGBControl-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: github-release-windows
          path: dist/FanARGBControl-Windows.zip
          if-no-files-found: error

  publish:
    needs: [firmware, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure release branch matches the current main and version is unique
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          release_tag="${GITHUB_REF_NAME#release/}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            [[ "$GITHUB_REF_NAME" == "release/$release_tag" ]]
            # Release archives must be built from exactly the current main SHA.
            [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
              echo "Tag already exists: $release_tag"; exit 1
            fi
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - uses: actions/download-artifact@v4
        with:
          name: github-release-firmware
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: github-release-windows
          path: release
      - name: Create paired GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/FanARGBControl-Windows.zip
          test -s release/ESP32S3-8Fan-8ARGB-firmware.zip
          release_tag="${GITHUB_REF_NAME#release/}"
          options=(--title "FanARGBControl $release_tag")
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            # gh release create also creates the lightweight tag at this main SHA.
            options+=(--target "$GITHUB_SHA")
          else
            options+=(--verify-tag)
          fi
          gh release create "$release_tag" \
            release/FanARGBControl-Windows.zip \
            release/ESP32S3-8Fan-8ARGB-firmware.zip \
            "${options[@]}" \
            --notes "Paired ESP32-S3 firmware and Windows EXE from commit $GITHUB_SHA. Both ZIPs contain SHA256SUMS and manifest.json. Install Windows updates manually; ESP32 flashing requires validated board and physical fan fail-ON. Checksums are not digital signatures."
) {
            throw 'Invalid release version tag'
          }
          "APP_VERSION = '$version'" | Set-Content pc_app/_release_version.py -Encoding utf8
      - name: Unit tests
        run: python -m unittest discover -s pc_app/tests -v
      - name: Install dependencies
        run: python -m pip install -r pc_app/requirements.txt pyinstaller
      - name: Smoke test Windows UI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest pc_app.tests.test_dashboard_smoke -v
      - name: Prepare verified NWinfo
        shell: pwsh
        run: ./pc_app/prepare_nwinfo.ps1 -OutputDirectory dist/nwinfo
      - name: Build standalone Windows EXE
        run: python -m PyInstaller --clean --noconfirm --windowed --onefile --paths pc_app --add-data "dist/nwinfo;nwinfo" --collect-all esptool --name FanARGBControl pc_app/main.py
      - name: Verify bundled modules and NWinfo
        run: python pc_app/verify_windows_bundle.py dist/FanARGBControl.exe
      - name: Package Windows release
        shell: pwsh
        run: |
          python scripts/build_manifest.py --component windows --directory dist --commit $env:GITHUB_SHA --file FanARGBControl.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows manifest failed' }
          Compress-Archive -Path @("dist/FanARGBControl.exe","dist/manifest.json","dist/SHA256SUMS") -DestinationPath dist/FanARGBControl-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: github-release-windows
          path: dist/FanARGBControl-Windows.zip
          if-no-files-found: error

  publish:
    needs: [firmware, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm version tag is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/download-artifact@v4
        with:
          name: github-release-firmware
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: github-release-windows
          path: release
      - name: Create paired GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/FanARGBControl-Windows.zip
          test -s release/ESP32S3-8Fan-8ARGB-firmware.zip
          gh release create "$GITHUB_REF_NAME" \
            release/FanARGBControl-Windows.zip \
            release/ESP32S3-8Fan-8ARGB-firmware.zip \
            --verify-tag \
            --title "FanARGBControl $GITHUB_REF_NAME" \
            --notes "Paired ESP32-S3 firmware and Windows EXE from commit $GITHUB_SHA. Both ZIPs contain SHA256SUMS and manifest.json. Install Windows updates manually; ESP32 flashing requires validated board and physical fan fail-ON. Checksums are not digital signatures."
