name: Windows desktop application
on:
  push:
    paths:
      - 'pc_app/**'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s pc_app/tests -v
      - name: Install dependencies
        run: python -m pip install -r pc_app/requirements.txt pyinstaller
      - name: Bundle EXE
        run: pyinstaller --clean --noconfirm --windowed --onefile --name FanARGBControl pc_app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: FanARGBControl-Windows
          path: dist/FanARGBControl.exe
