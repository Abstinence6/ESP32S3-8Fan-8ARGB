name: Windows desktop application
on:
  push:
    paths:
      - 'pc_app/**'
      - '.github/workflows/windows-app.yml'
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s pc_app/tests -v
      - name: Install dependencies
        run: python -m pip install -r pc_app/requirements.txt pyinstaller
      - name: Smoke-test desktop UI without a controller
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SAVE_DASHBOARD_PREVIEW = "1"
          python -m unittest pc_app.tests.test_dashboard_smoke -v
      - uses: actions/upload-artifact@v4
        with:
          name: FanARGBControl-UI-preview
          path: dist/ui-preview/*.png
          if-no-files-found: error
      - name: Bundle EXE
        run: python -m PyInstaller --clean --noconfirm --windowed --onefile --paths pc_app --name FanARGBControl pc_app/main.py
      - name: Verify Windows bundle includes local modules
        run: python pc_app/verify_windows_bundle.py dist/FanARGBControl.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FanARGBControl-Windows
          path: dist/FanARGBControl.exe
