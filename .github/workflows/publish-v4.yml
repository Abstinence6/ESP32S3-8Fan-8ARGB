name: Publish validated v4 cooling sources
on:
  push:
    branches: [feat/v4-smart-cooling-universal-fans]
    paths: ['.bootstrap/v4.b64']
permissions:
  contents: write
jobs:
  verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand v4 source bundle
        run: |
          python3 - <<'PY'
          import base64
          import json
          import zlib
          from pathlib import Path
          path = Path('.bootstrap/v4.b64')
          content = json.loads(zlib.decompress(base64.urlsafe_b64decode(path.read_text().strip())))
          for filename, text in content.items():
              target = Path(filename)
              if target.is_absolute() or '..' in target.parts or '.github' in target.parts or '.bootstrap' in target.parts:
                  raise ValueError('Refusing unsafe path: ' + filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          path.unlink()
          print('Updated files:', len(content))
          PY
      - name: Native C++ firmware tests
        run: bash test/native/run.sh
      - name: Python tests
        run: python3 -m unittest discover -s pc_app/tests -v
      - name: Python syntax check
        run: python3 -m compileall -q pc_app
      - name: ESP32-S3 PlatformIO compile
        run: |
          python3 -m pip install platformio
          pio run -e esp32s3
      - name: Commit and push validated sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: smart cooling, universal fan interfaces and desktop control v4'
          git push origin HEAD:feat/v4-smart-cooling-universal-fans
